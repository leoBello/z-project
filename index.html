    <!--
      Contenu de repli lu par les robots qui n'exécutent pas de JavaScript.
      React 19 vide `#root` à son premier rendu : ce bloc disparaît dès que le
      jeu démarre. Injecté au build par `plugins/seo.ts` depuis `src/i18n/fr.json`.
    -->
    <style>
      #seo-fallback {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: auto;
        padding: 2.5rem 1.5rem;
        background: #10161b;
        color: #d8d2c0;
        font: 16px/1.65 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #seo-fallback main {
        max-width: 46rem;
        margin: 0 auto;
      }
      #seo-fallback h1 {
        margin: 0;
        font-size: 1.9rem;
        color: #f5dc95;
      }
      #seo-fallback h2 {
        margin: 2.4rem 0 0.6rem;
        font-size: 1.15rem;
        color: #f5dc95;
      }
      #seo-fallback h3 {
        margin: 1.2rem 0 0.3rem;
        font-size: 1rem;
      }
      #seo-fallback a {
        color: #7fb8e6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
